name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dory-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Determine version
        id: version
        run: |
          node -e 'const v=require("./package.json").version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error("Expected a stable release version");require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`version=${v}\n`)'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: node --import tsx --test bin/dependency-overlay.test.mts bin/preview-static.test.mts
      - run: pnpm run build
      - run: node bin/dist/dory.js check
      - run: node scripts/verify-component-examples.mjs
      - name: Pack and scan the exact release
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dory-package" "$RUNNER_TEMP/dory-package-scan" "$RUNNER_TEMP/dory-scanner"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/dory-package"
          tar -xzf "$RUNNER_TEMP/dory-package/clidey-dory-$PACKAGE_VERSION.tgz" -C "$RUNNER_TEMP/dory-package-scan"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/dory-scanner/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/dory-scanner/scanner.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dory-scanner/scanner.tar.gz" -C "$RUNNER_TEMP/dory-scanner" gitleaks
          "$RUNNER_TEMP/dory-scanner/gitleaks" dir "$RUNNER_TEMP/dory-package-scan" --redact --no-banner
          cd "$RUNNER_TEMP/dory-package"
          sha256sum "clidey-dory-$PACKAGE_VERSION.tgz" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dory-npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/dory-package/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # This privileged job only publishes the tested artifact; it runs no source build.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dory-npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/dory-package/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check whether this exact artifact is already published
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const version = process.env.PACKAGE_VERSION;
          const file = `${process.env.RUNNER_TEMP}/dory-package/clidey-dory-${version}.tgz`;
          const expected = 'sha512-' + createHash('sha512').update(readFileSync(file)).digest('base64');
          const response = await fetch(`https://registry.npmjs.org/@clidey/dory/${version}`, {headers: {'Cache-Control': 'no-cache'}});
          let exists = false;
          if (response.ok) {
            const published = await response.json();
            if (published.version !== version || published.dist?.integrity !== expected) throw new Error('This version already exists with a different package checksum; publish a new version instead.');
            exists = true;
          } else if (response.status !== 404) throw new Error(`Registry check failed: ${response.status}`);
          appendFileSync(process.env.GITHUB_ENV, `DORY_ALREADY_PUBLISHED=${exists}\n`);
          JS
      - name: Publish verified package through npm trusted publishing
        if: env.DORY_ALREADY_PUBLISHED != 'true'
        run: |
          cd "$RUNNER_TEMP/dory-package"
          sha256sum --check SHA256SUMS
          npm publish "clidey-dory-$PACKAGE_VERSION.tgz" --ignore-scripts --access public --provenance
      - name: Confirm exact version is available before downstream release jobs
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {setTimeout} from 'node:timers/promises';
          const version = process.env.PACKAGE_VERSION;
          const file = `${process.env.RUNNER_TEMP}/dory-package/clidey-dory-${version}.tgz`;
          const expected = 'sha512-' + createHash('sha512').update(readFileSync(file)).digest('base64');
          for (let attempt = 0; attempt < 24; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/@clidey/dory/${version}`, {headers: {'Cache-Control': 'no-cache'}});
            if (response.ok) {
              const published = await response.json();
              if (published.version === version && published.dist?.integrity === expected) process.exit(0);
              throw new Error('Published package checksum differs from the tested artifact.');
            }
            if (response.status !== 404) throw new Error(`Registry check failed: ${response.status}`);
            await setTimeout(10000);
          }
          throw new Error('The exact published version is not yet available from npm.');
          JS

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ! gh release view "v$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "v$PACKAGE_VERSION"
          fi

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./k8s/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DORY_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            clidey/dory:${{ needs.prepare.outputs.version }}
            clidey/dory:latest
