name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config*.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'bin/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config*.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            actions-results-receiver-production.githubapp.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Scan documentation source for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/dory-secret-scan" "$RUNNER_TEMP/dory-source"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/dory-secret-scan/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/dory-secret-scan/scanner.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dory-secret-scan/scanner.tar.gz" -C "$RUNNER_TEMP/dory-secret-scan" gitleaks
          git archive HEAD | tar -x -C "$RUNNER_TEMP/dory-source"
          "$RUNNER_TEMP/dory-secret-scan/gitleaks" dir "$RUNNER_TEMP/dory-source" --redact --no-banner
      # Dory uses prebuilt packages; dependency lifecycle hooks stay disabled.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: node --import tsx --test bin/dependency-overlay.test.mts bin/preview-static.test.mts
      - run: pnpm run build
      - name: Check component preview layout and interactions
        run: node scripts/verify-component-examples.mjs
      - name: Save component review screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dory-component-review
          path: .dory/component-review/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan generated site for secrets
        run: '"$RUNNER_TEMP/dory-secret-scan/gitleaks" dir dist --redact --no-banner'
      - run: node bin/dist/dory.js check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: dory-documentation
          path: dist/
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
