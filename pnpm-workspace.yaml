# pnpm settings. Since pnpm 12, .npmrc only carries registry and auth settings;
# everything else lives here. See https://pnpm.io/settings

packages:
  - '.'

# Fail on missing or invalid peer dependencies
strictPeerDependencies: true

# Pin exact versions when adding new dependencies
saveExact: true

# Require the lockfile to match package.json
preferFrozenLockfile: true

# Fail `pnpm audit` on high or critical vulnerabilities
auditLevel: high

# Disable lifecycle scripts (preinstall, postinstall, etc.) to prevent arbitrary code execution
ignoreScripts: true

# Verify integrity of packages in the store before linking to node_modules
verifyStoreIntegrity: true

# Delay installation of packages published less than 7 days ago
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@clidey/ux'
  # semver 6.3.2 restores provenance for the 6.x line Babel needs; drop after 2026-11-09.
  - semver@6.3.2

# Block packages whose trust level dropped since earlier releases (e.g. lost
# trusted publishing).
trustPolicy: no-downgrade

overrides:
  reselect: 5.2.0
  react-redux: 9.3.0
